[package]
name = "omt-launcher"
version.workspace = true
description = "OMT Tools launcher"
authors.workspace = true
edition = "2024"
rust-version = "1.97"
license.workspace = true

[lib]
name = "omt_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "omt-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
suite-core = { path = "../../../crates/suite-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
thiserror = "2"
